spring.application.name=autosusbcali
spring.datasource.url=jdbc:postgresql://localhost:5432/servicios_db
spring.datasource.username=servicios_user
spring.datasource.password=servicios_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Niveles de log
logging.level.root=INFO
# Servicio de marcas: DEBUG para ver también las consultas
logging.level.co.edu.usbcali.autosusbcali.service.MarcaService=DEBUG
logging.level.co.edu.usbcali.autosusbcali.service.ModeloService=DEBUG

# Muestra en consola el SQL que ejecuta Hibernate (para ver los JOIN entre modelos y marcas)
logging.level.org.hibernate.SQL=DEBUG
spring.jpa.properties.hibernate.format_sql=true